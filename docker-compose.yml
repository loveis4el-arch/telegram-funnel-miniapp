services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: funnel
      POSTGRES_DB: funnel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funnel"]
      interval: 2s
      retries: 20

  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    environment: &dburl
      DATABASE_URL: postgresql://funnel:funnel@db:5432/funnel
      FUNNEL_CONFIG: /srv/${FUNNEL_CONFIG:-config.yaml}
    volumes: ["./config.yaml:/srv/config.yaml:ro", "./config.demo.yaml:/srv/config.demo.yaml:ro"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: *dburl
    volumes: ["./config.yaml:/srv/config.yaml:ro", "./config.demo.yaml:/srv/config.demo.yaml:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  tests:
    build: .
    profiles: [test]
    command: pytest -q
    environment:
      TEST_DATABASE_URL: postgresql://funnel:funnel@db:5432/funnel_test
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
