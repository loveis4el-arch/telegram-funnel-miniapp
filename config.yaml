# Тексты и тайминги воронки. Меняются без правки кода: правка → перезапуск бота.
# Сообщения по расписанию ничего не просят в ответ: бот ответы не разбирает (тест это проверяет).
# delay — секунды от момента, когда человек поделился телефоном; title — как шаг называется на дашборде;
# button + on_click — кнопка под сообщением и что бот пришлёт по нажатию (на дашборде — отдельный шаг);
# after: click:<key> — delay считается от нажатия кнопки этого шага (а не от телефона);
# before_webinar: N — шаг встаёт за N секунд до webinar_at (по часам эфира, а не от события).

greeting: |
  Привет, {name}! 👋
  Это мини-воронка регистрации на эфир.
ask_phone: Чтобы закрепить место, поделитесь номером телефона — кнопка ниже.
phone_button: 📱 Поделиться телефоном
phone_thanks: Спасибо, вы зарегистрированы! Скоро пришлю детали.
phone_not_own: Это не ваш контакт. Нажмите кнопку ниже, чтобы поделиться своим номером.
already_registered: Вы уже зарегистрированы — ждите сообщений 🙂

# Начало эфира (с часовым поясом). Сообщения с before_webinar встают по нему: 600 → за 10 минут, 0 → в момент начала.
webinar_at: "2026-11-05T18:00:00+03:00"

schedule:
  - key: reminder_1
    title: "Сообщение 1: напоминание"
    delay: 10
    text: "Напоминание: эфир завтра в 19:00 по Москве. Ссылка придёт за час до начала."
  - key: reminder_2
    title: "Сообщение 2: предложение чек-листа"
    delay: 60
    text: "Подготовили для вас чек-лист к эфиру 👇"
    button: 📋 Получить чек-лист
    on_click: |
      ✅ Чек-лист к эфиру

      🎧 За 10 минут до начала проверьте звук и интернет. Наушники лучше динамиков.
      ✍️ Запишите 1–2 вопроса спикеру: самые интересные разберём в прямом эфире.
      📒 Держите под рукой блокнот: будет практика, а не только теория.
      ⏰ Зайдите за 5 минут: первые 10 минут эфира — бонус для тех, кто пришёл вовремя.
      🎁 Досидите до конца: в финале подарок для всех участников.
  - key: live_soon
    title: "Сообщение 3: эфир через 10 минут"
    before_webinar: 600
    text: "⏰ Через 10 минут начинаем! Наливайте чай и готовьте вопросы."
  - key: live_now
    title: "Сообщение 4: мы в эфире"
    before_webinar: 0
    text: "🔴 Мы начали! Присоединяйтесь к эфиру прямо сейчас."

dashboard:
  button: 📊 Дашборд
  title: Воронка регистраций
